name: Security Pipeline (4 Gates + Unit Tests)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 WAJIB untuk Gitleaks — kalau tidak, cuma commit
      # terakhir yang di-scan, bukan seluruh history.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat folder hasil scan
        run: mkdir -p scan_results

      - name: Install dependencies proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # GATE 1 — Bandit (SAST, Python-native)
      # ---------------------------------------------------------------
      - name: Install Bandit
        run: pip install bandit

      - name: Gate 1 - Bandit SAST
        run: |
          bandit -r . \
            --exclude ./venv,./.venv,./tests \
            -f json -o scan_results/bandit.json
        # exit-zero: jangan langsung gagalkan job di sini — biar 4 gate
        # semua sempat jalan dan hasilnya lengkap buat agent triage nanti.
        # Fail-nya diputuskan terpusat di step "Evaluate gates" di bawah.
        continue-on-error: true

      # ---------------------------------------------------------------
      # GATE 2 — pip-audit (SCA, dependency vulnerabilities)
      # ---------------------------------------------------------------
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Gate 2 - pip-audit SCA
        run: |
          pip-audit -r requirements.txt \
            --format json --output scan_results/pip-audit.json
        continue-on-error: true

      # ---------------------------------------------------------------
      # GATE 3 — Trivy (filesystem + dependency scan)
      # ---------------------------------------------------------------
      - name: Gate 3 - Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: scan_results/trivy.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0" # sama alasannya dengan Bandit di atas

      # ---------------------------------------------------------------
      # GATE 4 — Gitleaks (secret scanning, perlu full history)
      # ---------------------------------------------------------------
      - name: Gate 4 - Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_EXIT_CODE: "0"
        continue-on-error: true

      # gitleaks-action outputnya beda struktur (results.sarif secara default);
      # baris ini pastikan ada juga versi JSON mentah untuk parser kita.
      - name: Normalisasi output Gitleaks ke JSON
        run: |
          if [ -f results.sarif ]; then
            cp results.sarif scan_results/gitleaks.json
          else
            echo "[]" > scan_results/gitleaks.json
          fi

      - name: Build image untuk scan
        run: docker build -t secure-fastapi-agent:${{ github.sha }} .

      - name: Gate 5 - Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-fastapi-agent:${{ github.sha }}
          format: json
          output: scan_results/trivy-image.json
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      # ---------------------------------------------------------------
      # Gabungkan 4 hasil pakai scan_parsers.py
      # ---------------------------------------------------------------
      - name: Gabungkan hasil scan
        run: python scan_parsers.py

      - name: Upload scan results (untuk agent triage - Fase 3)
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results/
          retention-days: 14

      # ---------------------------------------------------------------
      # Keputusan gagal/lulus terpusat di sini, bukan tersebar per gate
      # ---------------------------------------------------------------
      - name: Evaluate gates - gagalkan kalau ada temuan HIGH/CRITICAL
        run: |
          python -c "
          import json, sys
          findings = json.load(open('scan_results/combined.json'))
          high = [f for f in findings if f['severity'] in ('HIGH', 'CRITICAL')]
          if high:
              print(f'{len(high)} temuan HIGH/CRITICAL ditemukan:')
              for f in high:
                  print(f\"  [{f['tool']}] {f['title']} ({f['location']})\")
              sys.exit(1)
          print('Tidak ada temuan HIGH/CRITICAL.')
          "

  # =====================================================================
  # UNIT TESTS — sejajar dengan security-scan, TIDAK saling menunggu.
  # Sengaja terpisah: ini soal kebenaran fungsional, bukan temuan security.
  # =====================================================================
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  ai-triage:
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: always()
    continue-on-error: true # non-blocking, sesuai rencana Hari 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-agent.txt

      - name: Download hasil scan dari job security-scan
        uses: actions/download-artifact@v4
        with:
          name: scan-results
          path: scan_results

      - name: Jalankan AI triage
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python security_triage_graph.py

      - name: Upload hasil triage sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-triage-output
          path: triage_output.md

  build-and-push:
    runs-on: ubuntu-latest
    needs: [security-scan, unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hendraazka/secure-fastapi-agent:latest
            ghcr.io/hendraazka/secure-fastapi-agent:${{ github.sha }}
